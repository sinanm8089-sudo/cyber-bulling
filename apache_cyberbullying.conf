<VirtualHost *:80>
    ServerName cyberbullying.local
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/cyberbullying

    # Static and Media Files Routing
    Alias /static/ /var/www/cyberbullying/static/
    Alias /media/ /var/www/cyberbullying/media/

    <Directory /var/www/cyberbullying/static>
        Require all granted
    </Directory>

    <Directory /var/www/cyberbullying/media>
        Require all granted
    </Directory>

    # WSGI Configuration
    <Directory /var/www/cyberbullying/cyberbullying_system>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Process configuration for Python
    WSGIDaemonProcess cyberbullying python-home=/var/www/cyberbullying/venv python-path=/var/www/cyberbullying
    WSGIProcessGroup cyberbullying
    WSGIScriptAlias / /var/www/cyberbullying/cyberbullying_system/wsgi.py

    # Set Environment Variables for MySQL
    SetEnv DB_ENGINE mysql
    SetEnv DB_NAME cyberbullying
    SetEnv DB_USER db_user
    SetEnv DB_PASSWORD db_password
    SetEnv DB_HOST localhost
    SetEnv DB_PORT 3306

    ErrorLog ${APACHE_LOG_DIR}/cyberbullying-error.log
    CustomLog ${APACHE_LOG_DIR}/cyberbullying-access.log combined
</VirtualHost>
